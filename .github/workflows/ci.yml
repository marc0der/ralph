name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # action-shellcheck builds its file list with `find -name *<path>`, but
      # `find -name` only matches basenames — so any pattern containing a slash
      # (e.g. test/sandbox.bats) is silently skipped. Invoke shellcheck
      # directly so the test files are actually checked.
      - run: shellcheck --format=gcc ralph install.sh test/*.bats test/test_helper.bash

  test-linux:
    name: BATS Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ralph needs mikefarah yq v4; the runner image may ship none or another yq,
      # and the tests that need it skip silently when it is missing.
      - name: Install yq
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/yq" \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x "$HOME/.local/bin/yq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/yq" --version
      - uses: bats-core/bats-action@main
      - run: bats test/

  test-macos:
    name: BATS Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install bash bats-core jq yq gnu-getopt
      # ralph needs bash 4 and util-linux getopt, and macOS ships bash 3.2 and BSD
      # getopt. gnu-getopt is keg-only, so its bin directory goes on PATH by hand.
      - name: Put Homebrew tools first on PATH
        run: |
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-getopt)/bin" >> "$GITHUB_PATH"
      - name: Show tool versions
        run: |
          bash --version
          yq --version
      - run: bats test/
