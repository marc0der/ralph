name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # action-shellcheck builds its file list with `find -name *<path>`, but
      # `find -name` only matches basenames — so any pattern containing a slash
      # (e.g. test/sandbox.bats) is silently skipped. Invoke shellcheck
      # directly so the test files are actually checked.
      - run: shellcheck --format=gcc ralph install.sh test/*.bats test/test_helper.bash

  test:
    name: BATS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ralph needs mikefarah yq v4; the runner image may ship none or another yq,
      # and the tests that need it skip silently when it is missing.
      - name: Install yq
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/yq" \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x "$HOME/.local/bin/yq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/yq" --version
      - uses: bats-core/bats-action@main
      - run: bats test/
